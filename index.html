<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QR統合">
  <meta name="theme-color" content="#0f766e">
  <title>QR統合Webアプリ iPhone版</title>
  <style>
    :root{color-scheme:light;--ink:#10201d;--muted:#5f706c;--line:#d9e5e1;--brand:#0f766e;--bg:#eef5f3}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
    main{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
    .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 10px 28px rgba(15,52,47,.08)}
    h1{font-size:22px;line-height:1.25;margin:0 0 10px}
    p{color:var(--muted);line-height:1.65;margin:0 0 14px}
    .actions{display:grid;gap:10px}
    a.action{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:10px;background:var(--brand);color:#fff;text-decoration:none;font-size:16px;font-weight:850;text-align:center;padding:0 12px}
    a.secondary{background:#17324d}
    .qr{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#f8fbfa;text-align:center}
    .qr h2{margin:0 0 10px;font-size:16px}
    .qr img{width:min(100%,240px);height:auto;border:10px solid #fff;border-radius:8px}
    .url{overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>QR統合Webアプリ iPhone版</h1>
    <p>CSV統合、A4サマリー、QR生成、QR読み取り・復元をiPhoneのSafariで使うための入口です。</p>
    <div class="actions">
      <a class="action" href="./qr-generator.html">QR生成・CSV統合・A4サマリー</a>
      <a class="action secondary" href="./qr-receiver.html">QR読み取り・復元</a>
    </div>
    <div class="qr">
      <h2>この入口を開くQR</h2>
      <img src="./launch-qr.svg" alt="QR統合Webアプリを開くQRコード">
      <p class="url">https://ddstudio-apps.github.io/qr-receiver/</p>
    </div>
  </section>
</main>
</body>
</html>
